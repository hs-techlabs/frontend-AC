<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form style="max-width:480px; margin:auto; background:#ffffff; border:2.5px solid #0f172a; border-radius:20px; padding:24px; box-shadow:6px 6px 0 #0f172a;">
  <h3 style="font-weight:900; margin-bottom:14px;">Let's Connect ✉️</h3>
  <input type="text" placeholder="Your Name" style="width:100%; padding:10px; margin-bottom:10px; border:2px solid #0f172a; border-radius:8px;" />
  <input type="email" placeholder="Your Email" style="width:100%; padding:10px; margin-bottom:10px; border:2px solid #0f172a; border-radius:8px;" />
  <textarea placeholder="Your Message" rows="3" style="width:100%; padding:10px; margin-bottom:14px; border:2px solid #0f172a; border-radius:8px;"></textarea>
  <button type="submit" style="width:100%; background:#2563eb; color:#fff; padding:12px; font-weight:900; border:2px solid #0f172a; border-radius:8px; cursor:pointer;">Send Message 🚀</button>
</form>
</body>
</html>
